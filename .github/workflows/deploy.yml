# Full-stack deploy on push to main.
#
# This file is safe to have here before anything is configured. Each half
# checks for its own credentials and skips with a notice if they are absent,
# so a fresh clone gets a green build rather than a wall of red email.
#
# What runs, and when:
#
#   build      always. Type-checks and builds, so a broken push is caught here.
#   database   when the three SUPABASE_* secrets exist. Applies migrations,
#              then deploys edge functions.
#   web        only when VERCEL_TOKEN exists. Leave it unset if Vercel's own
#              Git integration is connected, which is the default setup and
#              already deploys on push. Setting it in that case gives you two
#              deploys per push.
#
# See docs/07-agent-runbook.md for how to set the secrets over the CLI.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys applying migrations to the same database at once is a bad time.
# Queue them instead, and never cancel one partway through a migration.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    name: Build and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  database:
    name: Migrations and functions
    needs: build
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations and deploy functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice title=Supabase deploy skipped::Set SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_REF to enable it. See docs/07-agent-runbook.md"
            exit 0
          fi

          supabase link --project-ref "$PROJECT_REF"

          echo "::group::Pending migrations"
          supabase db push --dry-run
          echo "::endgroup::"

          supabase db push --yes

          if [ -d supabase/functions ] && [ -n "$(ls -A supabase/functions 2>/dev/null)" ]; then
            supabase functions deploy --project-ref "$PROJECT_REF"
          else
            echo "No edge functions to deploy."
          fi

  web:
    name: Front end
    needs: [build, database]
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Deploy to Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice title=Vercel deploy skipped::Vercel's Git integration is handling this. Set VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID only if you disconnected it, or you will get two deploys per push. See docs/07-agent-runbook.md"
            exit 0
          fi

          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
